<!DOCTYPE html>
<html class="js consumer build-stable chrome win64-incapable mac twisty-js" lang="en" id="mac">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <meta content="initial-scale=1, minimum-scale=1, width=device-width" name="viewport">
  <title>
    Remote deep fake server for Improbotics
  </title>
  <link rel="stylesheet" href="/deepfake.css">
</head>

<body class="" id="grid">

  <div id="div_ui">
    <table align="left">
      <tr>
        <td>
          <label class="switch">
            <input type="checkbox" id="running_button" width=96px onclick="toggleRunning()">
            <span class="slider round"></span>
          </label>
        </td>
        <td align="left" width=96px>
          <label class="caption" id="running_button_state" align="left">
            Paused
          </label>
        </td>
        <td>
          <label class="switch">
            <input type="checkbox" id="many_faces_button" width=96px onclick="toggleManyFaces()">
            <span class="slider round"></span>
          </label>
        </td>
        <td align="left" width=96px>
          <label class="caption" id="many_faces_button_state" align="left">
            Single face
          </label>
        </td>
        <td>
          <label class="switch">
            <input type="checkbox" id="bg_remove_button" width=96px onclick="toggleBgRemove()">
            <span class="slider round"></span>
          </label>
        </td>
        <td align="left" width=96px>
          <label class="caption" id="bg_remove_button_state" align="left">
            Bg kept
          </label>
        </td>
        <td>
          <label class="switch">
            <input type="checkbox" id="camera_streaming_button" width=96px checked onclick="toggleCameraStreaming()">
            <span class="slider round"></span>
          </label>
        </td>
        <td align="left" width=96px>
          <label class="caption" id="camera_streaming_button_state" align="left">
            Streaming
          </label>
        </td>
        <td class="padded-cell">
          <button class="command" onclick="takePicture()" align="center">Take picture</button>
        </td>
        <td class="padded-cell">
          <button class="command" onclick="resetTarget()" align="center">Reset target</button>
        </td>
        <td class="padded-cell">
          <input type="text" id="search_query" placeholder="Enter image search query..."
            oninput="document.getElementById('generator_celebrity').value = this.value"
            onkeydown="if(event.key === 'Enter') performSearch()" />
        </td>
      </tr>
    </table>

    <table align="left" class="generator-table">
      <tr>
        <td class="generator-title">
          [ CELEBRITY GENERATOR ]
        </td>
        <td class="padded-cell">
          <input type="text" id="generator_celebrity" class="generator-input"
            placeholder="Celebrity Name (e.g. Tom Cruise)" />
        </td>
        <td class="padded-cell">
          <button class="command" id="btn_generate" onclick="startGeneration()">Generate Video</button>
        </td>
        <td class="padded-cell">
          <span id="generation_status_text"></span>
        </td>
      </tr>
    </table>

    <div class="main-container">
      <iframe id="source" src="/source"></iframe>
      <div id="search_results">
        <!-- Images will appear here -->
      </div>


    </div>
  </div>

</body>

<script src="./socket.io.js" crossorigin="anonymous"></script>
<script>


  // Toggle for paused / running
  function switchRunning(force = false) {
    if ((force == true) || (running_button.checked == false)) {
      sendGetQuery("active");
      showRunning();
    }
  };
  function switchPaused(force = false) {
    if ((force == true) || (running_button.checked == true)) {
      sendGetQuery("inactive");
      showPaused();
    }
  };
  // Toggle for pause
  function showPaused() {
    if (running_button.checked == true) {
      running_button.checked = false;
    }
    const caption = document.getElementById('running_button_state');
    if (caption.innerText != "Paused") {
      caption.innerText = "Paused";
    }
  };
  function showRunning() {
    if (running_button.checked == false) {
      running_button.checked = true;
    }
    const caption = document.getElementById('running_button_state');
    if (caption.innerText != "Running") {
      caption.innerText = "Running";
    }
  };
  function toggleRunning() {
    if (running_button.checked == true) {
      switchRunning(true);
    } else {
      switchPaused(true);
    }
  };


  // Toggle for paused / running
  function switchManyFaces(force = false) {
    if ((force == true) || (many_faces_button.checked == false)) {
      sendGetQuery("many_faces");
      showManyFaces();
    }
  };
  function switchSingleFace(force = false) {
    if ((force == true) || (many_faces_button.checked == true)) {
      sendGetQuery("single_face");
      showSingleFace();
    }
  };
  // Toggle for pause
  function showSingleFace() {
    if (many_faces_button.checked == true) {
      many_faces_button.checked = false;
    }
    const caption = document.getElementById('many_faces_button_state');
    if (caption.innerText != "Single face") {
      caption.innerText = "Single face";
    }
  };
  function showManyFaces() {
    if (many_faces_button.checked == false) {
      many_faces_button.checked = true;
    }
    const caption = document.getElementById('many_faces_button_state');
    if (caption.innerText != "Many faces") {
      caption.innerText = "Many faces";
    }
  };
  function toggleManyFaces() {
    if (many_faces_button.checked == true) {
      switchManyFaces(true);
    } else {
      switchSingleFace(true);
    }
  };


  // Toggle for background removal
  function switchBgRemove(force = false) {
    if ((force == true) || (bg_remove_button.checked == false)) {
      sendGetQuery("background_removal_on");
      showBgRemove();
    }
  };
  function switchBgKept(force = false) {
    if ((force == true) || (bg_remove_button.checked == true)) {
      sendGetQuery("background_removal_off");
      showBgKept();
    }
  };
  function showBgKept() {
    if (bg_remove_button.checked == true) {
      bg_remove_button.checked = false;
    }
    const caption = document.getElementById('bg_remove_button_state');
    if (caption.innerText != "Bg kept") {
      caption.innerText = "Bg kept";
    }
  };
  function showBgRemove() {
    if (bg_remove_button.checked == false) {
      bg_remove_button.checked = true;
    }
    const caption = document.getElementById('bg_remove_button_state');
    if (caption.innerText != "Bg removed") {
      caption.innerText = "Bg removed";
    }
  };
  function toggleBgRemove() {
    if (bg_remove_button.checked == true) {
      switchBgRemove(true);
    } else {
      switchBgKept(true);
    }
  };


  // Toggle for camera streaming
  function switchCameraStreaming(force = false) {
    if ((force == true) || (camera_streaming_button.checked == false)) {
      sendGetQuery("start_camera");
      showCameraStreaming();
    }
  };
  function switchCameraPaused(force = false) {
    if ((force == true) || (camera_streaming_button.checked == true)) {
      sendGetQuery("stop_camera");
      showCameraPaused();
    }
  };
  function showCameraPaused() {
    if (camera_streaming_button.checked == true) {
      camera_streaming_button.checked = false;
    }
    const caption = document.getElementById('camera_streaming_button_state');
    if (caption.innerText != "Cam paused") {
      caption.innerText = "Cam paused";
    }
  };
  function showCameraStreaming() {
    if (camera_streaming_button.checked == false) {
      camera_streaming_button.checked = true;
    }
    const caption = document.getElementById('camera_streaming_button_state');
    if (caption.innerText != "Streaming") {
      caption.innerText = "Streaming";
    }
  };
  function toggleCameraStreaming() {
    if (camera_streaming_button.checked == true) {
      switchCameraStreaming(true);
    } else {
      switchCameraPaused(true);
    }
  };


  // Callback for sending a command to the server
  function sendGetQuery(cmd) {
    var xmlHttp = new XMLHttpRequest();
    xmlHttp.open("GET", url_server + "/" + cmd, true);
    xmlHttp.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    xmlHttp.send(null);
  };

  function resetTarget() {
    sendGetQuery("reset_target");
  };


  function performSearch() {
    const searchInput = document.getElementById('search_query');
    const query = searchInput.value;
    if (!query) return;

    const originalPlaceholder = searchInput.placeholder;
    searchInput.value = '';
    searchInput.placeholder = 'Searching...';

    fetch('/search/' + encodeURIComponent(query))
      .then(response => response.json())
      .then(data => {
        searchInput.placeholder = originalPlaceholder;
        if (data.status === 'success') {
          loadExistingImages();
        } else {
          alert('Error: ' + data.message);
        }
      })
      .catch(error => {
        searchInput.placeholder = originalPlaceholder;
        alert('Error searching.');
        console.error(error);
      });
  }

  function takePicture() {
    var xmlHttp = new XMLHttpRequest();
    xmlHttp.open("GET", url_server + "/click", true);
    xmlHttp.onreadystatechange = function () {
      if (xmlHttp.readyState == 4 && xmlHttp.status == 200) {
        let camImg = document.getElementById('camera_img_thumbnail');
        if (camImg) {
          camImg.src = '/images/camera.jpg?t=' + new Date().getTime();
          camImg.style.display = 'block';
        }
      }
    }
    xmlHttp.send(null);
  }

  function loadExistingImages() {
    const resultsDiv = document.getElementById('search_results');

    let camImg = document.getElementById('camera_img_thumbnail');
    if (!camImg) {
      camImg = document.createElement('img');
      camImg.id = 'camera_img_thumbnail';
      camImg.className = 'thumbnail-img';
      camImg.onclick = function () {
        sendGetQuery('use_image/camera');
      };
      resultsDiv.appendChild(camImg);
    }
    camImg.onerror = function () {
      this.style.display = 'none';
    };
    camImg.src = '/images/camera.jpg?t=' + new Date().getTime();
    camImg.style.display = 'block';

    for (let i = 0; i < 3; i++) {
      let img = document.getElementById('search_img_' + i);
      if (!img) {
        img = document.createElement('img');
        img.id = 'search_img_' + i;
        img.className = 'thumbnail-img';
        img.onclick = function () {
          sendGetQuery('use_image/' + i);
        };
        resultsDiv.appendChild(img);
      }
      img.onerror = function () {
        this.style.display = 'none';
      };
      img.src = '/images/search_' + i + '.jpg?t=' + new Date().getTime();
      img.style.display = 'block';
    }
  }

  // Call on page load
  loadExistingImages();


  // Establish socket with server
  var url_server = window.location.origin;
  console.log("Attempting socket connection with:", url_server);
  var socket = io.connect(url_server);
  socket.on('connect', function () {
    url_server = window.location.origin;
    console.log("Connection has been succesfully established with socket.", url_server, socket.connected);
  });


  // Regularly query the socket
  setInterval(() => {
    socket.emit('status', {});
  }, 50);


  let lastSearchImage = null;

  // Callback for the status update
  socket.on('status-update', function (status) {
    if ("search_image" in status) {
      if (status["search_image"] !== lastSearchImage) {
        lastSearchImage = status["search_image"];
        loadExistingImages();
      }
    }
    if ("active" in status) {
      if (status["active"] == true) {
        showRunning();
      } else {
        showPaused();
      }
    }
    if ("many_faces" in status) {
      if (status["many_faces"] == true) {
        showManyFaces();
      } else {
        showSingleFace();
      }
    }
    if ("background_removal" in status) {
      if (status["background_removal"] == true) {
        showBgRemove();
      } else {
        showBgKept();
      }
    }
    if ("camera_streaming" in status) {
      if (status["camera_streaming"] == true) {
        showCameraStreaming();
      } else {
        showCameraPaused();
      }
    }
  });


  // --- Celebrity Generator Pipeline Code ---
  let generationInterval = null;

  function startGeneration() {
    const celebrityInput = document.getElementById('generator_celebrity');
    const title = "Improbotics";
    const celebrity = celebrityInput.value.trim();

    if (!celebrity || !title) {
      alert("Please enter both a Celebrity Name and a Show Title.");
      return;
    }

    const btn = document.getElementById('btn_generate');
    btn.disabled = true;
    btn.innerText = "Generating...";

    const statusText = document.getElementById('generation_status_text');
    statusText.innerText = "Initializing generation pipeline...";
    statusText.style.color = "#aa0000";

    fetch('/generate_celebrity?celebrity=' + encodeURIComponent(celebrity) + '&title=' + encodeURIComponent(title) + '&sentence=1')
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          // Start polling
          if (generationInterval) clearInterval(generationInterval);
          generationInterval = setInterval(pollGenerationStatus, 1000);
        } else {
          alert('Error starting generation: ' + data.message);
          btn.disabled = false;
          btn.innerText = "Generate Video";
          statusText.innerText = "Failed: " + data.message;
          statusText.style.color = "#ff0000";
        }
      })
      .catch(error => {
        alert('Failed to connect to server.');
        btn.disabled = false;
        btn.innerText = "Generate Video";
        statusText.innerText = "Connection failed.";
        statusText.style.color = "#ff0000";
      });
  }

  function pollGenerationStatus() {
    fetch('/generation_status')
      .then(response => response.json())
      .then(data => {
        const statusText = document.getElementById('generation_status_text');
        const btn = document.getElementById('btn_generate');

        if (data.status === 'idle') {
          if (generationInterval) {
            clearInterval(generationInterval);
            generationInterval = null;
          }
          btn.disabled = false;
          btn.innerText = "Generate Video";
          statusText.innerText = "";
          return;
        }

        // Format step display
        let stepLabels = {
          "description": "Description",
          "voice_description": "Voice",
          "image": "Image",
          "video": "Veo Video",
          "swap": "Face Swap"
        };

        let stepsText = [];
        let steps = ["description", "voice_description", "image", "video", "swap"];

        for (let i = 0; i < steps.length; i++) {
          let step = steps[i];
          let val = data.steps[step];
          let statusIndicator = "";

          if (val === "failed") {
            statusIndicator = "FAIL";
          } else if (val !== 0) {
            statusIndicator = "DONE";
          } else if (data.current_step === step) {
            statusIndicator = "RUNNING";
          } else {
            statusIndicator = "PENDING";
          }
          stepsText.push(stepLabels[step] + ": " + statusIndicator);
        }

        statusText.innerText = "Pipeline: [" + data.status.toUpperCase() + "] | " + stepsText.join(" | ");

        if (data.status === 'completed') {
          if (generationInterval) {
            clearInterval(generationInterval);
            generationInterval = null;
          }
          btn.disabled = false;
          btn.innerText = "Generate Video";
          statusText.innerText = "Generation finished successfully!";
          statusText.style.color = "#00ff00";
        } else if (data.status === 'failed') {
          if (generationInterval) {
            clearInterval(generationInterval);
            generationInterval = null;
          }
          btn.disabled = false;
          btn.innerText = "Generate Video";
          statusText.innerText = `Pipeline failed during ${stepLabels[data.current_step] || data.current_step}`;
          statusText.style.color = "#ff0000";
        }
      })
      .catch(error => {
        console.error("Error polling generation status:", error);
      });
  }


</script>

</html>
